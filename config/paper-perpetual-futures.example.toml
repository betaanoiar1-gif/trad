# Separate, simulation-only Perpetual Futures declaration. The local paper
# engine applies explicit margin, fee, funding, and liquidation assumptions;
# these settings never submit exchange orders or access private endpoints.

[run]
mode = "paper"
instrument = "perpetual_futures"
symbol = "BTC/USDT:USDT"
market_data_source = "public_read_only"

[safety]
simulation_only = true

[perpetual_futures]
starting_collateral = 1000.0
initial_leverage = 1.0
max_leverage = 1.0

[resources]
max_cpu_workers = 1
