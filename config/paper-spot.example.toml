# Paper-mode declaration for the offline Spot paper engine. This file is
# validated only by the CLI; it never places exchange orders.

[run]
mode = "paper"
instrument = "spot"
symbol = "BTC/USDT"
# The public connector is read-only and must be wired explicitly by Python
# code before the Spot paper engine can accept orders.
market_data_source = "public_read_only"

[safety]
simulation_only = true

[spot]
starting_quote_balance = 1000.0
starting_base_balance = 0.0

[resources]
max_cpu_workers = 1
