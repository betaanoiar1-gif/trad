name: Offline tests and build checks

on:
  push:

permissions:
  contents: read

jobs:
  tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run offline unit and integration tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Validate dashboard browser script
        run: node --check src/trad/web/app.js

      - name: Build package and verify dashboard assets
        run: |
          python -m pip wheel . --no-deps --no-build-isolation -w /tmp/trad-wheel
          unzip -l /tmp/trad-wheel/trad-*.whl | grep -E 'trad/(dashboard.py|web/(index.html|app.js|styles.css))'
